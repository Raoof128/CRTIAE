# Prometheus Configuration for Red Team C2 Framework

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'c2-framework'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Teamserver metrics
  - job_name: 'teamserver'
    static_configs:
      - targets: ['teamserver:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Database exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-exporter:9323']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Custom application metrics
  - job_name: 'c2_custom'
    static_configs:
      - targets: ['teamserver:8443']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

