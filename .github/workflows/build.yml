name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-implant:
    name: Build Go Implant
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build implant
      working-directory: ./implant
      run: |
        go mod download
        go build -v -o implant main.go

    - name: Run tests
      working-directory: ./implant
      run: go test -v ./...

    - name: Cross-compile for Windows
      working-directory: ./implant
      run: |
        GOOS=windows GOARCH=amd64 go build -o implant.exe main.go

    - name: Upload implant artifacts
      uses: actions/upload-artifact@v3
      with:
        name: implant-binaries
        path: |
          implant/implant
          implant/implant.exe

  build-teamserver:
    name: Build Rust Teamserver
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache Cargo build
      uses: actions/cache@v3
      with:
        path: teamserver/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      working-directory: ./teamserver
      run: cargo fmt -- --check

    - name: Run clippy
      working-directory: ./teamserver
      run: cargo clippy -- -D warnings

    - name: Build teamserver
      working-directory: ./teamserver
      run: cargo build --release --verbose

    - name: Run tests
      working-directory: ./teamserver
      run: cargo test --verbose

    - name: Upload teamserver artifact
      uses: actions/upload-artifact@v3
      with:
        name: teamserver-binary
        path: teamserver/target/release/teamserver

  test-controller:
    name: Test Python Controller
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      working-directory: ./controller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      working-directory: ./controller
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test CLI
      working-directory: ./controller
      run: |
        python main.py --help

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build teamserver image
      uses: docker/build-push-action@v5
      with:
        context: ./teamserver
        push: false
        tags: c2-teamserver:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build controller image
      uses: docker/build-push-action@v5
      with:
        context: ./controller
        push: false
        tags: c2-controller:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
