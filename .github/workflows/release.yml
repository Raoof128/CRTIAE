name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## Red Team C2 Framework Release

            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Installation

            Download the appropriate binary for your platform below.

            **Important**: This is a security research tool. Use only with proper authorization.

  build-multi-platform:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build implant
        working-directory: ./implant
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o implant-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} main.go

      - name: Create archive
        working-directory: ./implant
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip implant-${{ matrix.os }}-${{ matrix.arch }}.zip implant-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
            ASSET_PATH="implant-${{ matrix.os }}-${{ matrix.arch }}.zip"
            ASSET_NAME="implant-${{ matrix.os }}-${{ matrix.arch }}.zip"
            ASSET_TYPE="application/zip"
          else
            tar czf implant-${{ matrix.os }}-${{ matrix.arch }}.tar.gz implant-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
            ASSET_PATH="implant-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
            ASSET_NAME="implant-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
            ASSET_TYPE="application/gzip"
          fi
          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "ASSET_TYPE=$ASSET_TYPE" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./implant/${{ env.ASSET_PATH }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: ${{ env.ASSET_TYPE }}

  build-teamserver:
    name: Build Teamserver
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build teamserver
        working-directory: ./teamserver
        run: cargo build --release

      - name: Create archive
        working-directory: ./teamserver
        run: |
          tar czf teamserver-linux-amd64.tar.gz -C target/release teamserver

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./teamserver/teamserver-linux-amd64.tar.gz
          asset_name: teamserver-linux-amd64.tar.gz
          asset_content_type: application/gzip

  generate-checksums:
    name: Generate Checksums
    needs: [build-multi-platform, build-teamserver]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate checksums
        run: |
          sha256sum * > checksums.txt

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./checksums.txt
          asset_name: checksums.txt
          asset_content_type: text/plain

  publish-docker:
    name: Publish Docker Images
    needs: create-release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Raoof128'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push teamserver
        uses: docker/build-push-action@v5
        with:
          context: ./teamserver
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/c2-teamserver:latest
            ghcr.io/${{ github.repository_owner }}/c2-teamserver:${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push controller
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/c2-controller:latest
            ghcr.io/${{ github.repository_owner }}/c2-controller:${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64
